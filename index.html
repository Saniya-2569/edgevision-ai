<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeVision AI - Real-time Object Classifier</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@latest"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { margin-bottom: 5px; color: #38bdf8; }
    p { color: #94a3b8; margin-top: 0; margin-bottom: 20px; }
    .container {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 680px;
      width: 100%;
    }
    #webcam-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      height: 480px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .status { margin-top: 15px; font-size: 1.1rem; font-weight: 600; }
    .predictions {
      width: 100%;
      margin-top: 15px;
      background: #0f172a;
      border-radius: 8px;
      padding: 15px;
      box-sizing: border-box;
    }
    .pred-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .bar-bg {
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      background: #38bdf8;
      width: 0%;
      transition: width 0.2s ease;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h1>EdgeVision AI</h1>
  <p>Real-time client-side Edge Computer Vision inference engine powered by TensorFlow.js & MobileNet v2</p>

  <div class="container">
    <button id="start-btn" onclick="init()">Start Camera & Classifier</button>
    <div id="webcam-container">
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div id="status" class="status">Click button to initialize MobileNet v2 model...</div>
    <div class="predictions" id="predictions">
      <div class="pred-item"><span>Predictions will appear here once started.</span></div>
    </div>
  </div>

  <script>
    let model;
    const videoElement = document.getElementById('webcam');
    const statusElement = document.getElementById('status');
    const predictionsElement = document.getElementById('predictions');

    async function init() {
      statusElement.innerText = "Loading MobileNet v2 model...";
      try {
        model = await mobilenet.load({ version: 2, alpha: 1.0 });
        statusElement.innerText = "Model loaded. Starting webcam...";
        await setupWebcam();
        statusElement.innerText = "EdgeVision AI Running - Real-time Inference Active";
        predictLoop();
      } catch (err) {
        statusElement.innerText = "Error: " + err.message;
      }
    }

    async function setupWebcam() {
      return new Promise((resolve, reject) => {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(stream => {
              videoElement.srcObject = stream;
              videoElement.addEventListener('loadeddata', () => resolve(), false);
            })
            .catch(err => reject(err));
        } else {
          reject(new Error("Webcam access not supported on this browser."));
        }
      });
    }

    async function predictLoop() {
      if (model && videoElement.readyState === 4) {
        const predictions = await model.classify(videoElement);
        renderPredictions(predictions);
      }
      requestAnimationFrame(predictLoop);
    }

    function renderPredictions(predictions) {
      predictionsElement.innerHTML = '';
      predictions.forEach(p => {
        const percentage = (p.probability * 100).toFixed(1);
        const itemHtml = `
          <div style="margin-bottom: 10px;">
            <div class="pred-item">
              <span>${p.className}</span>
              <span>${percentage}%</span>
            </div>
            <div class="bar-bg">
              <div class="bar-fill" style="width: ${percentage}%"></div>
            </div>
          </div>
        `;
        predictionsElement.innerHTML += itemHtml;
      });
    }
  </script>
</body>
</html>
