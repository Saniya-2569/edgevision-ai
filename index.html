<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeVision AI - Real-time Object Classifier</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      margin-top: 30px;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 5px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
    }
    .container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 640px;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 75%; /* 4:3 Aspect Ratio */
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #f59e0b;
    }
    .predictions {
      margin-top: 15px;
      width: 100%;
    }
    .pred-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #334155;
      margin-bottom: 6px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .bar-bg {
      background: #475569;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      background: #38bdf8;
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>EdgeVision AI</h1>
    <p>On-device object classification powered by TensorFlow.js</p>
  </div>

  <div class="container">
    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div id="status" class="status">Click button to initialize MobileNet v2 model...</div>
    <div class="predictions" id="predictions">
      <div class="pred-item"><span>Predictions will appear here once started.</span></div>
    </div>
  </div>

<script>
  let model;
  const videoElement = document.getElementById('webcam');
  const statusElement = document.getElementById('status');
  const predictionsElement = document.getElementById('predictions');

  async function init() {
    statusElement.innerText = "Loading MobileNet v2 model...";
    try {
      model = await mobilenet.load({ version: 2, alpha: 1.0 });
      statusElement.innerText = "Model loaded. Starting webcam...";
      await setupWebcam();
      statusElement.innerText = "EdgeVision AI Running - Real-time Inference Active";
      predictLoop();
    } catch (err) {
      statusElement.innerText = "Error: " + err.message;
    }
  }

  async function setupWebcam() {
    return new Promise((resolve, reject) => {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
          .then(stream => {
            videoElement.srcObject = stream;
            videoElement.addEventListener('loadeddata', () => resolve(), false);
          })
          .catch(err => reject(err));
      } else {
        reject(new Error("Webcam access not supported on this browser."));
      }
    });
  }

  async function predictLoop() {
    if (model && videoElement.readyState === 4) {
      const predictions = await model.classify(videoElement);
      renderPredictions(predictions);
    }
    requestAnimationFrame(predictLoop);
  }

  function renderPredictions(predictions) {
    predictionsElement.innerHTML = '';
    predictions.forEach(p => {
      const percentage = (p.probability * 100).toFixed(1);
      const itemHtml = `
        <div style="margin-bottom: 10px;">
          <div class="pred-item">
            <span>${p.className}</span>
            <span>${percentage}%</span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill" style="width: ${percentage}%"></div>
          </div>
        </div>
      `;
      predictionsElement.innerHTML += itemHtml;
    });
  }
</script>
</body>
</html>
